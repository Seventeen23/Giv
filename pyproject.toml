[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giv"
version = "0.0.1"
description = "Giv: turn a local LLM into a fast, CPU-friendly typed decision model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
anyjev = ["anyjev[hf]>=0.3.0"]
torch = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=7"]

[project.scripts]
giv = "giv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
